# Konfigurasi utama AI Office.
# Path relatif dihitung dari folder tempat file ini berada.

server:
  host: 127.0.0.1        # default HANYA localhost. Jangan ganti ke 0.0.0.0 kecuali paham risikonya.
  port: 8000

paths:
  data_dir: data         # database, aset, cache (di-gitignore)
  output_dir: output     # hasil render sementara per job
  db_file: ai_office.db

pipeline:
  # semi_auto  = ada 2 gerbang persetujuan admin (naskah & video final)
  # full_auto  = gerbang dilewati HANYA jika review keamanan lulus
  mode: semi_auto
  max_safety_rounds: 2     # maksimal putaran revisi naskah dari Penasihat Keamanan
  max_llm_retries: 2       # maksimal retry bila output LLM tidak lolos validasi
  poll_interval_sec: 2.0   # seberapa sering worker mengecek antrean
  just_done_display_sec: 15  # berapa lama status "baru selesai" tampil di dashboard

content:
  age_group: "3-6"
  language: en             # id = Bahasa Indonesia (pakai edge-tts) | en = English (bisa XTTS)
  style: cheerful
  profile_file: content_profile.yaml

llm:
  provider: ollama         # ollama (default, lokal) | gemini (opsional, free tier)
  model: qwen2.5:7b        # muat di VRAM 6 GB (RTX 4050)
  base_url: http://127.0.0.1:11434
  timeout_sec: 180
  temperature: 0.7
  num_ctx: 8192
  think: null              # untuk model "thinking" (mis. qwen3) isi false agar lebih cepat
  gemini_model: gemini-flash-latest   # hanya dipakai jika provider: gemini (butuh GEMINI_API_KEY)

safety:
  rubric_file: safety_rubric.yaml     # rubrik Penasihat Keamanan Anak (boleh diubah)
  temperature: 0.2

voice:
  engine: xtts               # edge-tts (gratis, online) | xtts (lokal, English) | piper
  voice: id-ID-GadisNeural   # alternatif: id-ID-ArdiNeural
  rate: "-5%"                # sedikit lebih lambat agar mudah diikuti anak
  pitch: "+0Hz"
  pause_after_sec: 0.6       # jeda setelah narasi tiap scene
  min_scene_sec: 2.0
  loudness_lufs: -16.0       # normalisasi volume
  sample_rate: 48000
  max_retries: 2
  speedup_percent: 15        # bila total > video.max_duration_sec, suara dipercepat sekali
  xtts:                      # dipakai hanya jika engine: xtts (lihat requirements-xtts.txt)
    model: tts_models/multilingual/multi-dataset/xtts_v2
    language: en             # XTTS TIDAK mendukung 'id'. Didukung: en, es, fr, de, dst.
    speaker_wav: ""          # path WAV contoh suara (6-15 dtk) untuk voice cloning; kosong = bawaan
    speaker: "Ana Florence"  # suara bawaan bila speaker_wav kosong
    device: auto             # auto | cuda | cpu
    temperature: 0.7
    unload_after_job: true   # lepaskan dari VRAM tiap job agar bergantian dengan Ollama
    stub_matplotlib: true    # hindari impor matplotlib (atasi blokir Smart App Control Windows)

video:
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 30
  min_duration_sec: 25
  max_duration_sec: 35
  encoder: auto            # auto | h264_nvenc | libx264

subtitle:
  enabled: true
  font: "Fredoka,Baloo 2,Comic Sans MS,Arial"
  font_size: 74
  y_offset: 300            # jarak subtitle dari bawah (px)
  text_color: "FFFFFF"
  outline_color: "3D2C4F"
  highlight_color: "FFD43B"  # warna kata yang sedang diucapkan
  max_chars_per_line: 22

music:
  enabled: true
  bgm_dir: data/bgm        # isi sendiri musik bebas hak cipta (.mp3/.wav/.m4a/.ogg)
  volume: 0.18             # volume dasar musik
  duck_volume: 0.07        # volume musik saat ada narasi
  fade_sec: 1.0

delivery:
  dest_dir: ~/Videos/AI-Office
  open_folder: true

agents:
  # Agent yang masih "palsu" (simulasi). Agent asli ditambahkan per milestone.
  # Pilihan: writer, safety, voice, animator, editor, delivery
  # Tips: tambahkan writer & safety ke daftar ini untuk mencoba tanpa Ollama.
  fake: []                 # semua agent asli; isi mis. [voice, animator, editor] untuk simulasi
  fake_delay_sec: 1.0
