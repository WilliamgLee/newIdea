<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Office</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>AI Office</h1>
    <span id="conn" class="muted">menghubungkan…</span>
    <a href="/admin" class="admin-link">Panel Admin</a>
  </header>

  <!-- Kantor 2.5D isometrik: tiap agent di mejanya, status real-time via SSE -->
  <div id="office-wrap">
    <canvas id="office"></canvas>
  </div>

  <section class="summary-bar">
    <ul id="summary"></ul>
  </section>

  <section class="videos">
    <h2>Video selesai</h2>
    <table>
      <thead><tr><th>ID</th><th>Judul / Topik</th><th>Status</th><th>Durasi</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </section>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
